name: build and push

on:
  push:
    branches: [main, feat/deploy]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: foxene/serverapp:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: install ansible
        run: pip install ansible

      - name: setup ssh key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 2222 ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: create inventory
        run: |
          cat > inventory.ini << EOF
          [prod_servers]
          server ansible_host=${{ secrets.SERVER_HOST }} ansible_port=2222 ansible_user=webdev

          [prod_servers:vars]
          ansible_ssh_common_args='-o StrictHostKeyChecking=no'
          EOF

      - name: run ansible deploy
        run: ansible-playbook deploy/ansible/deploy.yml -i inventory.ini -e ansible_become_password=${{ secrets.BECOME_PASSWORD }}
