- name: deploy client server app
  hosts: prod_servers
  gather_facts: false
  become: true

  vars:
    ansible_user: "webdev"
    ansible_port: 2222
    ansible_ssh_private_key_file: "~/.ssh/id_ed25519"
    username: "webdev"
    db_name: "studs"
    db_user: "s505205"
    db_password: "Oc5UQVlhW4HfHtX5"
    app_dir: /opt/ClientServerApp

  vars_prompt:
    - name: ansible_become_password
      prompt: "sudo password for {{ ansible_user }}"
      private: yes

  tasks:
    - name: install k3s
      shell: curl -sfL https://get.k3s.io | sh -s - --write-kubeconfig-mode 644
      args:
        creates: /etc/systemd/system/k3s.service
      timeout: 300
      retries: 3
      delay: 5
      register: k3s_install
      until: k3s_install.rc == 0

    - name: wait for k3s to be ready
      command: k3s kubectl get nodes
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: k3s_nodes
      retries: 12
      delay: 5
      until: k3s_nodes.rc == 0

    - name: clone repository
      ansible.builtin.git:
        repo: "https://github.com/FoXeNe/ClientServerApp.git"
        dest: "{{ app_dir }}"
        version: feat/deploy
        force: yes

    - name: generate secret manifest
      ansible.builtin.copy:
        dest: "{{ app_dir }}/deploy/k8s/secret.yaml"
        content: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: db-secret
          type: Opaque
          stringData:
            DB_USER: "{{ db_user }}"
            DB_PASSWORD: "{{ db_password }}"
            POSTGRES_USER: "{{ db_user }}"
            POSTGRES_PASSWORD: "{{ db_password }}"
            POSTGRES_DB: "{{ db_name }}"
        mode: '0600'

    - name: apply k3s manifests
      command:
        cmd: bash script.sh
        chdir: "{{ app_dir }}/deploy/k8s"
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
