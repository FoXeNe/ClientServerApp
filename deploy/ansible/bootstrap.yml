---
- name: base server setup
  hosts: prod_servers
  gather_facts: false
  become: true

  vars:
    username: "webdev"
    ssh_port: 2222
    local_pub_key_path: "~/.ssh/id_ed25519.pub"
    ansible_become_password: "1"

  tasks:
    - name: generate random password
      set_fact:
        user_password: "{{ lookup('community.general.random_string', length=16, special=false) }}"

    - name: calculate password hash
      command: openssl passwd -6 "{{ user_password }}"
      register: remote_password_hash
      changed_when: false
      no_log: true
      delegate_to: localhost
      become: false

    - name: update apt package cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: install sudo and ufw
      apt:
        name:
          - sudo
          - ufw
        state: present

    - name: create a new user
      user:
        name: "{{ username }}"
        shell: /bin/bash
        groups: sudo
        append: yes
        password: "{{ remote_password_hash.stdout }}"
        state: present

    - name: set ssh key for new user
      ansible.posix.authorized_key:
        user: "{{ username }}"
        state: present
        key: "{{ lookup('file', local_pub_key_path) }}"

    - name: configure sudo for the new user
      copy:
        content: "{{ username }} ALL=(ALL:ALL) ALL\n"
        dest: "/etc/sudoers.d/{{ username }}"
        mode: '0440'
        validate: 'visudo -cf %s'

    - name: allow ufw ports
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - '22'
        - "{{ ssh_port }}"

    - name: enable ufw firewall and set default deny incoming policy
      ufw:
        state: enabled
        policy: deny
        direction: incoming

    - name: configure ssh settings
      lineinfile:
        dest: /etc/ssh/sshd_config
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
        validate: 'sshd -t -f %s'
      loop:
        - { regexp: '^#?Port ', line: 'Port {{ ssh_port }}' }
        - { regexp: '^#?PermitRootLogin ', line: 'PermitRootLogin no' }
        - { regexp: '^#?PasswordAuthentication ', line: 'PasswordAuthentication no' }
      notify: restart ssh service

    - name: display credentials
      debug:
        msg:
          - "========================================================="
          - "username: {{ username }}"
          - "ssh port: {{ ssh_port }}"
          - "password: {{ user_password }}"
          - "ip: {{ ansible_host }}"
          - "========================================================="

  handlers:
    - name: restart ssh service
      service:
        name: ssh
        state: restarted
